
<!-- AFTERGLOW CITY — COPYRIGHT & DEMO PROTECTION -->
<script>
(() => {
  "use strict";

  const owner = "Laurence Macaspac";
  const year = "2026";

  // Add copyright metadata without changing the design.
  const metadata = {
    author: owner,
    copyright: `Copyright © ${year} ${owner}. All rights reserved.`,
    referrer: "strict-origin-when-cross-origin"
  };

  Object.entries(metadata).forEach(([name, content]) => {
    let meta = document.querySelector(`meta[name="${name}"]`);
    if (!meta) {
      meta = document.createElement("meta");
      meta.name = name;
      document.head.appendChild(meta);
    }
    meta.content = content;
  });

  // Display a copyright and licensing notice in the footer.
  const footer = document.querySelector("footer");

  if (footer && !document.getElementById("afterglow-license")) {
    const notice = document.createElement("div");
    notice.id = "afterglow-license";
    notice.style.cssText = `
      margin-top: 18px;
      padding: 20px 12px 0;
      border-top: 1px solid #404640;
      color: #cdd4c9;
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
    `;

    notice.textContent =
      `© ${year} ${owner}. All rights reserved. ` +
      "Public design demonstration only. " +
      "No unauthorized copying, redistribution, " +
      "resale, or commercial reuse. " +
      "A separate license is required for commercial use.";

    footer.appendChild(notice);
  }

  // Keep existing demo functionality and protection intact.
  // Public browser-delivered code remains inspectable.
})();
</script>
<!-- END AFTERGLOW CITY COPYRIGHT & DEMO PROTECTION -->
